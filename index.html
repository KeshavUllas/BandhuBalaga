<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Game Night Live</title>
<style>
:root{--bg:#090b16;--panel:#15192a;--line:#303650;--text:#fff;--muted:#aeb5cb;--accent:#6978ff;--gold:#f2bd42;--green:#31c48d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20264a 0,#090b16 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#2a3150;color:#fff;font-weight:800}button:hover{filter:brightness(1.12)}button.primary{background:var(--accent)}button.green{background:#167b55}button.gold{background:#956b16}button.red{background:#652638}
.app{min-height:100vh}.hostbar{position:sticky;top:0;z-index:5;background:#101427ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.hostbar .brand{font-weight:900}.host-controls{display:flex;gap:7px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 58px)}aside{background:#12162a;border-right:1px solid var(--line);padding:18px;overflow:auto}main{padding:28px;max-width:1500px;width:100%;margin:auto}
label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}input,select{width:100%;background:#0c1020;border:1px solid #3a4261;color:#fff;border-radius:10px;padding:11px}.row{display:flex;gap:7px}.row>*{flex:1}.players{margin-top:8px}.player{display:flex;gap:6px;margin:7px 0}.player input{flex:1}.muted{color:var(--muted)}.hidden{display:none!important}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.kicker{color:#8f9cff;font-weight:900;font-size:14px}.title{font-size:clamp(28px,5vw,58px);font-weight:950;letter-spacing:-1px}.timer{font-size:46px;font-weight:950}
.card{background:#151a2dca;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 60px #0004;margin-top:18px}.current{text-align:center}.current .playername{font-size:clamp(28px,5vw,48px);font-weight:950}.score{font-size:clamp(60px,10vw,100px);font-weight:950;line-height:1}.scorebuttons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:15px}.scorebuttons button{padding:15px 4px}
table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}th:last-child,td:last-child{text-align:right}.rank{font-weight:950}.leader{overflow:auto}
.notice{padding:12px 14px;border-radius:12px;background:#222944;color:#dfe3ff;margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#111;border-radius:14px;padding:14px 18px;font-weight:900;display:none;z-index:20;box-shadow:0 15px 50px #0008}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pod{text-align:center;background:#222844;border-radius:16px;padding:18px}.pod .pts{font-size:30px;font-weight:950}
.final{text-align:center;padding:50px 20px}.final .crown{font-size:80px}.final h1{font-size:clamp(40px,8vw,80px);margin:8px 0}.final .winnerScore{font-size:80px;font-weight:950}
.viewer-badge{background:#26305a;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.scorebuttons{grid-template-columns:repeat(3,1fr)}.hero{align-items:center}.timer{font-size:32px}}
@media(max-width:600px){.podium{grid-template-columns:repeat(2,1fr)}}
#viewerLiveBar{border:2px solid rgba(255,255,255,.18)}
@media(max-width:600px){#viewerLiveBar #viewerTimer{font-size:68px}}
</style>
</head>
<body>
<div class="app">
<div class="hostbar">
  <div class="brand">🎉 ಬಂಧು ಬಳಗ (Kitty) - Sept 2026 <span id="modeBadge"></span></div>
  <div class="host-controls" id="topControls">
    <button onclick="copyViewerLink()">🔗 Copy viewer link</button>
    <button onclick="toggleFullscreen()">⛶ TV fullscreen</button>
  </div>
</div>
<div class="layout">
<aside id="hostPanel">
  <div id="loginArea" class="card" style="margin-top:0">
    <h2>👑 Host Login</h2>
    <div class="muted">Sign in to control the live scoreboard.</div>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="Host email">
    <label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
    <button class="primary" style="width:100%;margin-top:12px" onclick="hostLogin()">Start Game</button>
    <div id="loginMsg" class="notice hidden"></div>
  </div>
  <div id="setupArea" class="hidden">
    <label>Game</label><select id="game" onchange="selectGame(this.value)"></select>
    <label>Current player</label><select id="current" onchange="selectPlayer(this.value)"></select>
    <label>Add player</label><div class="row"><input id="newPlayer" placeholder="Name"><button class="primary" onclick="addPlayer()">Add</button></div>
    <div id="players" class="players"></div>
    <label>Score controls</label>
    <div class="scorebuttons">
      <button onclick="changeScore(1)">+1</button><button onclick="changeScore(5)">+5</button><button onclick="changeScore(10)">+10</button>
      <button onclick="changeScore(-1)">−1</button><button onclick="changeScore(-5)">−5</button><button onclick="changeScore(-10)">−10</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="green" onclick="saveScore()">✓ Save score</button><button onclick="undo()">Undo</button></div>
    <label>Timer</label>
    <div class="row"><button class="primary" onclick="startTimer()">▶</button><button onclick="pauseTimer()">⏸</button><button onclick="resetTimer()">↺</button></div>
    <div class="row" style="margin-top:7px"><button onclick="setTime(60)">60 sec</button><button onclick="setTime(120)">120 sec</button></div>
    <label>Game control</label><div class="row"><button class="gold" onclick="nextGame()">Next game</button><button class="red" onclick="newGame()">New game</button></div>
    <div class="notice" id="syncStatus">Local mode — scores stay on this device.</div>
  </div>
</aside>
<main id="screen">
  <div class="hero">
    <div><div class="kicker" id="gameLabel"></div><div class="title">ಬಂಧು ಬಳಗ (Kitty) - Sept 2026</div></div>
    <div class="timer" id="timer">01:00</div>
  </div>
  <div class="card current">
    <div class="muted">CURRENT PLAYER</div>
    <div class="playername" id="currentName">Player 1</div>
    <div class="score" id="currentScore">0</div>
    <div class="muted" id="currentHint">Host is entering the score…</div>
  </div>
  <div class="card leader"><h2>🏆 LIVE LEADERBOARD</h2><div id="leaderboard"></div></div>
  <div class="card"><h2>⭐ TOP 6</h2><div id="podium" class="podium"></div></div>
</main>
</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   ಬಂಧು ಬಳಗ (Kitty) - Sept 2026 v2
   Firebase-ready: paste your Firebase web config below.
   Host writes; viewers read only. See SETUP.md.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyARI0-zN4pIu8NVU9g8v-lKzots4NogNys",
  authDomain: "bandhu-balaga.firebaseapp.com",
  databaseURL: "https://bandhu-balaga-default-rtdb.firebaseio.com",
  projectId: "bandhu-balaga",
  storageBucket: "bandhu-balaga.firebasestorage.app",
  messagingSenderId: "209041712015",
  appId: "1:209041712015:web:74e683a8ee3e654d9d21fa"
};

const games=[["🐝","Boxes & Bees"],["🃏","Card & Dice"],["🔤","Scrabble"],["🪙","Colour Coin Hunt"],["✏️","Draw & Guess"],["🎯","Dart + Balloon Finale"]];
let players=["Player 1","Player 2","Player 3","Player 4"];
let scores=players.map(()=>games.map(()=>0));
let current=0,game=0,draft=0,seconds=60,timerId=null,history=[],finalShown=false;
let db=null, dbRef=null, hostUid=null, sessionId=null;

const $=id=>document.getElementById(id);
const viewer=new URLSearchParams(location.search).get("view")==="1";
$("modeBadge").innerHTML=viewer?'<span class="viewer-badge">VIEW ONLY</span>':'<span class="viewer-badge">HOST</span>';
if(viewer){$("hostPanel").classList.add("hidden");$("topControls").innerHTML='<button onclick="toggleFullscreen()">⛶ Fullscreen</button>'; $("currentHint").textContent="Game is in progress";}

function renderGameOptions(){ $("game").innerHTML=games.map((g,i)=>`<option value="${i}">${g[0]} ${g[1]}</option>`).join(""); }
function renderPlayers(){
 if(viewer)return;
 $("players").innerHTML=players.map((p,i)=>`<div class="player"><input value="${esc(p)}" onchange="renamePlayer(${i},this.value)"><button class="red" onclick="removePlayer(${i})">×</button></div>`).join("");
 $("current").innerHTML=players.map((p,i)=>`<option value="${i}" ${i===current?"selected":""}>${esc(p)}</option>`).join("");
}
function totals(){return players.map((_,i)=>scores[i].reduce((a,b)=>a+b,0))}
function sorted(){return totals().map((total,i)=>({name:players[i],total,i})).sort((a,b)=>b.total-a.total)}
function updateViewerLiveUI(){
  if(!viewer)return;
  const bar=$("viewerLiveBar");
  if(bar)bar.classList.remove("hidden");
  const name=(games[game]&&games[game].name)||"Game";
  const title=$("viewerGameTitle"); if(title)title.textContent=name;
  const hint=$("currentHint"); if(hint)hint.textContent="Game "+name+" is in progress";
  const vt=$("viewerTimer"); if(vt)vt.textContent=formatTimeValue(seconds);
}
function render(){updateViewerLiveUI();
 $("game").value=game; $("current").value=current; $("gameLabel").textContent=games[game][0]+"  "+games[game][1];
 $("currentName").textContent=players[current]||"—"; $("currentScore").textContent=draft;
 const t=sorted();
 $("leaderboard").innerHTML=`<table><thead><tr><th>Rank</th><th>Player</th>${games.map(g=>`<th>${g[0]}</th>`).join("")}<th>TOTAL</th></tr></thead><tbody>`+
 t.map((p,r)=>`<tr><td class="rank">${r===0?"🥇":r===1?"🥈":r===2?"🥉":r+1}</td><td><b>${esc(p.name)}</b></td>${games.map((_,gi)=>`<td>${scores[p.i][gi]}</td>`).join("")}<td><b>${p.total}</b></td></tr>`).join("")+"</tbody></table>";
 $("podium").innerHTML=t.slice(0,6).map((p,i)=>`<div class="pod"><div style="font-size:30px">${["🥇","🥈","🥉"][i]}</div><b>${esc(p.name)}</b><div class="pts">${p.total}</div></div>`).join("");
}
function selectGame(v){game=+v;draft=scores[current][game];render();pushState()}
function selectPlayer(v){current=+v;draft=scores[current][game];render()}
function changeScore(n){if(viewer)return;history.push({i:current,g:game,old:draft});draft=Math.max(0,draft+n);render();toast((n>0?"+":"")+n+" points")}
function saveScore(){if(viewer)return;scores[current][game]=draft;history=[];pushState();toast(`${players[current]} scored ${draft}!`)}
function undo(){if(viewer)return;let h=history.pop();if(!h)return;current=h.i;game=h.g;draft=h.old;render()}
function addPlayer(){if(viewer)return;let n=$("newPlayer").value.trim();if(!n)return;players.push(n);scores.push(games.map(()=>0));$("newPlayer").value="";current=players.length-1;draft=0;renderPlayers();render();pushState()}
function removePlayer(i){if(viewer||players.length<=1)return;if(!confirm("Remove "+players[i]+"?"))return;players.splice(i,1);scores.splice(i,1);current=Math.min(current,players.length-1);draft=scores[current][game];renderPlayers();render();pushState()}
function renamePlayer(i,n){if(viewer)return;if(n.trim())players[i]=n.trim();render();pushState()}
function nextGame(){if(viewer)return;if(game<games.length-1){game++;draft=scores[current][game];resetTimer();render();pushState();toast("Next: "+games[game][1])}else showFinal()}
function newGame(){if(viewer)return;if(!confirm("Start a new game and clear all scores?"))return;players=["Player 1","Player 2","Player 3","Player 4"];scores=players.map(()=>games.map(()=>0));current=0;game=0;draft=0;finalShown=false;renderPlayers();render();pushState()}
function showFinal(){finalShown=true;let t=sorted();$("screen").innerHTML=`<div class="card final"><div class="crown">🏆</div><div class="muted">ಬಂಧು ಬಳಗ (Kitty) - Sept 2026 CHAMPION</div><h1>${esc(t[0]?.name||"—")}</h1><div class="winnerScore">${t[0]?.total||0}</div><div class="muted">TOTAL POINTS</div><div class="podium" style="margin-top:25px">${t.slice(1,7).map((p,i)=>`<div class="pod"><div>${["🥈","🥉","4️⃣","5️⃣","6️⃣"][i]}</div><b>${esc(p.name)}</b><div class="pts">${p.total}</div></div>`).join("")}</div></div>`}
function startTimer(){
  if(timerId||viewer)return;
  pushState();
  timerId=setInterval(()=>{
    if(seconds>0){seconds--;updateTimer();pushState();}
    else{pauseTimer();toast("⏰ TIME!");pushState();}
  },1000);
}
function pauseTimer(){
  clearInterval(timerId);timerId=null;
  if(!viewer)pushState();
}
function resetTimer(){
  pauseTimer();seconds=60;updateTimer();
  if(!viewer)pushState();
}
function setTime(s){
  pauseTimer();seconds=s;updateTimer();
  if(!viewer)pushState();
}
function updateTimer(){
  const text=formatTimeValue(seconds);
  if($("timer"))$("timer").textContent=text;
  if(viewer&&$("viewerTimer"))$("viewerTimer").textContent=text;
}
function localState(){return {players,scores,current,game,seconds}}}
function applyState(s){
  if(!s)return;
  players=Array.isArray(s.players)?s.players:players;
  scores=Array.isArray(s.scores)?s.scores:scores;
  current=s.current!==undefined?Number(s.current):current;
  game=s.game!==undefined?Number(s.game):game;
  if(s.seconds!==undefined)seconds=Math.max(0,Number(s.seconds)||0);
  renderPlayers();render();updateTimer();
}
let firebaseReady=false;
let firebaseListenerStarted=false;


function startRealtimeListener(){
  if(!db||!dbRef||!sessionId||!window.__onValue||firebaseListenerStarted)return;
  firebaseListenerStarted=true;
  window.__onValue(dbRef(db,"sessions/"+sessionId),snap=>{
    const data=snap.val();
    if(data){
      applyState(data);
      if($("syncStatus"))$("syncStatus").textContent=viewer?"🟢 LIVE — view only":"🟢 CONNECTED — cloud scores loaded";
    }else if(!viewer){
      pushState();
    }else if($("syncStatus")){
      $("syncStatus").textContent="🟡 Waiting for host to start this game";
    }
  },err=>{
    console.error("Firebase read failed:",err);
    if($("syncStatus"))$("syncStatus").textContent="🔴 Firebase connection failed";
  });
}

async function setupFirebase(){
  try{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
    const {getDatabase,ref,onValue,set}=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js");
    const {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js");
    const app=initializeApp(FIREBASE_CONFIG);
    db=getDatabase(app); dbRef=ref;
    window.__set=set; window.__onValue=onValue;
    const auth=getAuth(app);
    window.__auth=auth; window.__signIn=signInWithEmailAndPassword;
    sessionId=new URLSearchParams(location.search).get("session")||"sept-2026";

    onAuthStateChanged(auth,async user=>{
      if(viewer){
        try{
          if(!user)await signInAnonymously(auth);
          if($("syncStatus"))$("syncStatus").textContent="🟡 CONNECTING — view only";
          startRealtimeListener();
        }catch(e){
          console.error(e);
          if($("syncStatus"))$("syncStatus").textContent="🔴 Viewer connection failed";
        }
        return;
      }
      if(user&&!user.isAnonymous){
        hostUid=user.uid;
        $("loginArea").classList.add("hidden");
        $("setupArea").classList.remove("hidden");
        $("topControls").innerHTML='<button onclick="copyViewerLink()">🔗 Copy viewer link</button><button onclick="toggleFullscreen()">⛶ TV fullscreen</button><button onclick="hostLogout()">Log out</button>';
        $("syncStatus").textContent="🟡 CONNECTING TO CLOUD…";
        startRealtimeListener();
      }else{
        $("loginArea").classList.remove("hidden");
        $("setupArea").classList.add("hidden");
      }
    });
  }catch(e){
    console.error(e);
    $("loginMsg").textContent="Firebase could not load. Check your internet connection.";
    $("loginMsg").classList.remove("hidden");
  }
}
async function hostLogin(){
  const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
  if(!email||!password){showLoginMsg("Enter your host email and password.");return}
  try{await window.__signIn(window.__auth,email,password)}
  catch(e){console.error(e);showLoginMsg("Login failed. Check your email/password and Email/Password authentication.")}
}
async function hostLogout(){try{await window.__auth.signOut()}catch(e){}}
function showLoginMsg(msg){$("loginMsg").textContent=msg;$("loginMsg").classList.remove("hidden")}
async function pushState(){
  const state=localState();
  localStorage.setItem("familyGameNightState",JSON.stringify(state));
  if(db&&dbRef&&sessionId&&!viewer&&window.__set){
    try{
      await window.__set(dbRef(db,"sessions/"+sessionId),state);
      firebaseReady=true;
      if($("syncStatus"))$("syncStatus").textContent="🟢 SAVED TO CLOUD — live sync enabled";
      return true;
    }catch(e){
      console.error("Firebase write failed:",e);
      if($("syncStatus"))$("syncStatus").textContent="🔴 Firebase save failed — local copy kept";
      toast("Cloud save failed");
    }
  }
  return false;
}
function loadLocal(){try{let s=JSON.parse(localStorage.getItem("familyGameNightState"));if(s)applyState(s)}catch(e){}}
renderGameOptions();renderPlayers();if(!viewer)loadLocal();render();updateTimer();setupFirebase();
window.hostLogin=hostLogin;window.hostLogout=hostLogout;window.selectGame=selectGame;window.selectPlayer=selectPlayer;window.changeScore=changeScore;window.saveScore=saveScore;window.undo=undo;window.addPlayer=addPlayer;window.removePlayer=removePlayer;window.renamePlayer=renamePlayer;window.nextGame=nextGame;window.newGame=newGame;window.startTimer=startTimer;window.pauseTimer=pauseTimer;window.resetTimer=resetTimer;window.setTime=setTime;window.toggleFullscreen=toggleFullscreen;window.copyViewerLink=copyViewerLink;
</script>
</body>
</html>
